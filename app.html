<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#FFFFFF">
  <title>Speech Recording</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23D9F0E1'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231E9E52'/%3E%3C/svg%3E">
  <script>
    // Theme first (no flash), then the sign-in and version gate. main.js waits for
    // window.__v2sGate before starting anything.
    (function () {
      try {
        var theme = localStorage.getItem('v2s_theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) { /* storage unavailable */ }

      var APP_VERSION = '213';
      var path = window.location.pathname;
      if (sessionStorage.getItem('v2s_auth_ok') !== '1') {
        window.location.replace('/index.html?next=' + encodeURIComponent(path + window.location.search + window.location.hash));
        window.__v2sGate = new Promise(function () {});
        return;
      }
      // While the new recorder is being tested at app_next.html it follows its own version key.
      var versionKey = /\/app_next\.html$/.test(path) ? 'nextAppVersion' : 'appVersion';
      window.__v2sGate = fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (response) { return response.ok ? response.json() : null; })
        .catch(function () { return null; })
        .then(function (data) {
          var latest = (data && data[versionKey]) || APP_VERSION;
          var url = new URL(window.location.href);
          if (url.searchParams.get('v') !== latest) {
            url.searchParams.set('v', latest);
            window.location.replace(url.pathname + url.search + url.hash);
            return new Promise(function () {});
          }
          return true;
        });
    })();
  </script>
  <link rel="stylesheet" href="css/base.css?v=213">
  <link rel="stylesheet" href="css/app.css?v=213">
</head>
<body data-screen="loading" data-rec="off">
  <div class="app" id="app">
    <!-- Top bar. Recording screen: End for today (left), where you are (centre), help and
         settings (right); while recording only "where you are" stays. Other screens:
         settings only. -->
    <header class="topbar" id="topbar">
      <div class="topbar-start">
        <button class="nav-btn" id="finishButton" type="button" hidden><span class="label-long" id="finishLong"></span><span class="label-short" id="finishShort"></span></button>
      </div>
      <div class="topbar-title">
        <div class="where" id="where" hidden>
          <p class="where-text"><span class="where-long" id="whereMain"></span><span class="where-short" id="whereShort"></span></p>
          <div class="bar" aria-hidden="true"><div class="bar-fill" id="whereBar"></div></div>
        </div>
      </div>
      <div class="topbar-end">
        <button class="icon-btn" id="helpButton" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25"/><path d="M9.4 9.4a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.3-2.6 4.1M12 17.4v.2"/></svg>
        </button>
        <button class="icon-btn" id="settingsButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </header>

    <main class="screens">
      <!-- Loading -->
      <section class="screen screen-flow" id="screen-loading">
        <div class="flow"><div class="flow-body flow-center">
          <div class="spinner" aria-hidden="true"></div>
          <p class="meta" id="loadingText"></p>
        </div></div>
      </section>

      <!-- First-time setup: research team or helper, once per device -->
      <section class="screen screen-flow" id="screen-setup" hidden>
        <div class="flow">
          <div id="setupStepId" class="flow-step">
            <div class="flow-body">
              <p class="eyebrow" id="setupEyebrow"></p>
              <h1 id="setupTitle"></h1>
              <p class="lead" id="setupLead"></p>
              <form id="setupForm" class="form" novalidate autocomplete="off">
                <label class="field-label" for="setupId" id="setupIdLabel"></label>
                <input class="input input-xl" id="setupId" name="participant" type="text" inputmode="text"
                       autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24">
                <p class="field-hint" id="setupHint"></p>
                <p class="field-error" id="setupError" role="alert" hidden></p>
              </form>
            </div>
            <div class="flow-actions">
              <button class="btn btn-go btn-xl btn-block" id="setupNext" type="submit" form="setupForm"></button>
            </div>
          </div>
          <div id="setupStepConfirm" class="flow-step" hidden>
            <div class="flow-body flow-center">
              <h1 id="setupConfirmTitle"></h1>
              <p class="id-display" id="setupConfirmId"></p>
              <div class="options" id="setupLegacy" hidden></div>
            </div>
            <div class="flow-actions">
              <button class="btn btn-go btn-xl btn-block" id="setupConfirmYes" type="button"></button>
              <button class="btn-text" id="setupConfirmChange" type="button"></button>
            </div>
          </div>
          <div id="setupStepFolder" class="flow-step" hidden>
            <div class="flow-body flow-center">
              <div class="symbol symbol-neutral" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2.5h6.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/></svg></div>
              <h1 id="setupFolderTitle"></h1>
              <p class="lead" id="setupFolderLead"></p>
              <p class="field-error" id="setupFolderError" role="alert" hidden></p>
            </div>
            <div class="flow-actions">
              <button class="btn btn-go btn-xl btn-block" id="setupFolderChoose" type="button"></button>
              <button class="btn-text" id="setupFolderZip" type="button"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Welcome -->
      <section class="screen screen-flow" id="screen-welcome" hidden>
        <div class="flow">
          <div class="flow-body flow-center">
            <p class="eyebrow" id="welcomeId"></p>
            <h1 id="welcomeTitle"></h1>
            <p class="lead" id="welcomeLead"></p>
            <!-- What will happen (first visit): information, not buttons. -->
            <ul class="feature-list" id="welcomeStages" hidden>
              <li><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.75" y="6" width="13.5" height="12" rx="2.5"/><path d="m16.25 10.25 5-2.75v9l-5-2.75"/></svg></span><span id="welcomeStage1"></span></li>
              <li><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.75 5.75h14.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H10l-4.25 3.5V17.25h-1a1.5 1.5 0 0 1-1.5-1.5v-8.5a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="M8 10.5h8M8 13.5h5"/></svg></span><span id="welcomeStage2"></span></li>
              <li><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg></span><span id="welcomeStage3"></span></li>
            </ul>
            <!-- Where you are (returning). -->
            <div class="journey" id="welcomeJourney" hidden>
              <p class="journey-label" id="welcomePart"></p>
              <div class="parts-bar" id="welcomeParts" aria-hidden="true"></div>
              <p class="journey-count" id="welcomeCount"></p>
            </div>
            <p class="rule" id="welcomeRule" hidden></p>
            <div class="notice" id="welcomeNotice" hidden>
              <p id="welcomeNoticeText"></p>
              <button class="btn btn-ghost btn-md" id="welcomeNoticeAction" type="button"></button>
            </div>
          </div>
          <div class="flow-actions">
            <button class="btn btn-go btn-xl btn-block" id="welcomeStart" type="button"></button>
          </div>
        </div>
      </section>

      <!-- Folder permission (Chrome/Edge folder mode) -->
      <section class="screen screen-flow" id="screen-folder" hidden>
        <div class="flow">
          <div class="flow-body flow-center">
            <div class="symbol symbol-neutral" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2.5h6.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/></svg></div>
            <h1 id="folderTitle"></h1>
            <p class="lead" id="folderLead"></p>
            <p class="field-error" id="folderError" role="alert" hidden></p>
          </div>
          <div class="flow-actions">
            <button class="btn btn-go btn-xl btn-block" id="folderAllow" type="button"></button>
            <button class="btn btn-ghost btn-lg btn-block" id="folderChoose" type="button"></button>
            <button class="btn-text" id="folderZip" type="button"></button>
          </div>
        </div>
      </section>

      <!-- Camera and microphone check, one step at a time: 1 place the camera, 2 a test
           recording that plays back. The picture stays in the same place throughout. -->
      <section class="screen" id="screen-check" hidden>
        <div class="check">
          <div class="check-media">
            <div class="preview-frame" id="checkFrame">
              <video id="checkPreview" playsinline muted autoplay></video>
              <video id="checkPlayback" playsinline hidden></video>
              <!-- One head oval in the middle, the rest dimmed: only the head has to fit. As on
                   the first version; fixed by the owner (2026-10-05), do not change it. -->
              <div class="face-guide" aria-hidden="true"></div>
              <p class="preview-badge" id="checkBadge"></p>
            </div>
            <canvas class="wave wave-check" id="checkWave" aria-hidden="true"></canvas>
          </div>
          <div class="check-panel">
            <div class="check-step" id="checkStepCamera">
              <p class="eyebrow" id="checkCameraStep"></p>
              <h1 id="checkCameraTitle"></h1>
              <p class="check-text" id="checkCameraText"></p>
              <div class="check-actions">
                <button class="btn btn-go btn-xl btn-block" id="checkNext" type="button"></button>
              </div>
            </div>
            <div class="check-step" id="checkStepMic" hidden>
              <p class="eyebrow" id="checkMicStep"></p>
              <h1 id="checkMicTitle"></h1>
              <p class="check-text" id="checkMicText"></p>
              <div class="notice notice-stack" id="micWarning" hidden>
                <p id="micWarningText"></p>
                <button class="btn btn-ghost btn-md" id="micSwitch" type="button" hidden></button>
              </div>
              <div class="check-actions" id="testBox">
                <button class="btn btn-start btn-xl btn-block" id="testRecord" type="button"><span class="btn-icon"><span class="dot-go"></span></span><span id="testRecordLabel"></span></button>
                <div class="test-live" id="testLive" hidden>
                  <p class="test-say"><span class="test-say-label" id="testSayLabel"></span> <span class="test-say-phrase" id="testSay"></span></p>
                  <div class="bar bar-strong" aria-hidden="true"><div class="bar-fill" id="testBar"></div></div>
                </div>
                <p class="test-status" id="testStatus" hidden></p>
                <div class="test-ask" id="testAsk" hidden>
                  <p class="test-question" id="testQuestion"></p>
                  <button class="btn btn-go btn-xl btn-block" id="testYes" type="button"></button>
                  <div class="test-links">
                    <button class="btn-text" id="testReplay" type="button"></button>
                    <button class="btn-text" id="testAgain" type="button"></button>
                  </div>
                  <p class="test-hint" id="testHint"></p>
                </div>
                <p class="field-error" id="testError" role="alert" hidden></p>
              </div>
            </div>
            <button class="btn-text check-help" id="checkHelp" type="button"></button>
          </div>
        </div>
      </section>

      <!-- Recording (practice and real sentences). The sentence is the one thing on the
           screen: centred, a little above the middle, nothing around it but its state.
           The camera picture sits small in the corner. Below: the practice coach (or a
           message), Start/Stop and Redo. The guide keeps one height in practice and in
           the real recording, so the sentence never moves. -->
      <!-- Before the practice: the one thing to remember. -->
      <section class="screen screen-flow" id="screen-intro" hidden>
        <div class="flow">
          <div class="flow-body flow-center">
            <p class="eyebrow" id="introEyebrow"></p>
            <h1 id="introTitle"></h1>
            <p class="rule" id="introRule"></p>
            <p class="lead intro-lead" id="introLead"></p>
          </div>
          <div class="flow-actions">
            <button class="btn btn-go btn-xl btn-block" id="introStart" type="button"></button>
          </div>
        </div>
      </section>

      <section class="screen screen-record" id="screen-record" hidden data-state="ready">
        <!-- Above the card: Redo at the top left, far from Start (where a Back button
             goes); the camera picture and sound level at the top right, grey and still
             when not recording, live while recording. -->
        <div class="record-top">
          <div class="redo-slot">
            <button class="btn redo" id="redoButton" type="button" tabindex="-1">
              <span class="redo-label"><span class="btn-icon" id="redoIcon" aria-hidden="true"></span><span id="redoLabel"></span><kbd class="key-hint" aria-hidden="true">←</kbd></span>
              <span class="redo-caption" id="redoCaption"></span>
            </button>
          </div>
          <div class="monitor" aria-hidden="true">
            <canvas class="monitor-wave" id="recordWave"></canvas>
            <div class="cam-thumb" id="recordFrame"><video id="recordPreview" playsinline muted autoplay></video></div>
          </div>
        </div>

        <!-- The sentence card: the one place to look. -->
        <div class="stage" id="card">
          <p class="status" id="cardStatus" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="cardStatusText"></span>
          </p>
          <div class="stage-text"><p class="sentence" id="sentenceText"></p></div>
        </div>

        <!-- At the bottom, where a thumb reaches: the one instruction (practice) or a
             problem to fix, then Start/Stop. -->
        <div class="dock">
          <div class="guide">
            <div class="coach" id="coach" hidden aria-live="polite">
              <p class="coach-ack" id="coachAck"><span class="coach-ack-icon" id="coachAckIcon" aria-hidden="true"></span><span id="coachAckText"></span></p>
              <p class="coach-action" id="coachAction"></p>
              <p class="coach-detail" id="coachDetail"></p>
            </div>
            <p class="message is-empty" id="message" aria-live="polite">
              <span class="message-body"><span class="message-icon" id="messageIcon" aria-hidden="true"></span><span id="messageText"></span></span>
            </p>
          </div>
          <button class="btn btn-start btn-main" id="mainButton" type="button" tabindex="-1">
            <span class="btn-icon" id="mainIcon" aria-hidden="true"></span>
            <span id="mainLabel"></span>
            <span class="btn-time" id="cardTimer"></span>
            <kbd class="key-hint" aria-hidden="true">Space</kbd>
          </button>
        </div>
      </section>

      <!-- Practice done, part breaks, and saving -->
      <section class="screen screen-flow" id="screen-break" hidden>
        <div class="flow">
          <div class="flow-body flow-center">
            <div class="symbol symbol-done" id="breakSymbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6.5 12.5 3.6 3.6 7.4-8"/></svg></div>
            <h1 id="breakTitle"></h1>
            <!-- What just happened (saved) comes first, then what to do. -->
            <div class="save-panel" id="breakSave">
              <p class="save-panel-text" id="breakSaveText"></p>
              <div class="save-progress" id="breakSaveProgress" hidden>
                <div class="bar" aria-hidden="true"><div class="bar-fill" id="breakSaveBar"></div></div>
                <span class="meta" id="breakSaveLabel"></span>
              </div>
            </div>
            <p class="lead" id="breakLead"></p>
            <p class="rule" id="breakRule" hidden></p>
            <div class="parts" id="breakParts" hidden>
              <div class="parts-bar" id="breakPartsBar" aria-hidden="true"></div>
              <p class="parts-label" id="breakPartsLabel"></p>
            </div>
          </div>
          <div class="flow-actions">
            <button class="btn btn-go btn-xl btn-block" id="breakPrimary" type="button"></button>
            <button class="btn-text" id="breakSecondary" type="button"></button>
            <button class="btn-text" id="breakTertiary" type="button" hidden></button>
          </div>
        </div>
      </section>

      <!-- Done -->
      <section class="screen screen-flow" id="screen-done" hidden>
        <div class="flow">
          <div class="flow-body flow-center">
            <div class="symbol symbol-neutral" id="doneBadge" aria-hidden="true"></div>
            <h1 id="doneTitle"></h1>
            <div class="save-panel" id="doneSavePanel" hidden><p class="save-panel-text" id="doneSaveText"></p></div>
            <p class="lead" id="doneBody"></p>
          </div>
          <div class="flow-actions">
            <button class="btn btn-go btn-xl btn-block" id="doneSave" type="button" hidden></button>
            <button class="btn-text" id="doneAgain" type="button"></button>
          </div>
        </div>
      </section>

      <!-- Problems -->
      <section class="screen screen-flow" id="screen-error" hidden>
        <div class="flow">
          <div class="flow-body flow-center">
            <div class="symbol symbol-warn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.4v.2"/><path d="M10.3 3.9 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
            <h1 id="errorTitle"></h1>
            <p class="lead" id="errorBody"></p>
            <p class="help-text" id="errorHelp" hidden></p>
          </div>
          <div class="flow-actions">
            <button class="btn btn-go btn-xl btn-block" id="errorAction" type="button"></button>
            <button class="btn-text" id="errorSecondary" type="button" hidden></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Watches the camera for a frozen picture. Always rendered (2 px, nearly transparent):
       the preview is hidden while recording, and browsers stop updating hidden videos. -->
  <video class="monitor-video" id="monitorVideo" playsinline muted autoplay aria-hidden="true" tabindex="-1"></video>

  <div class="overlay" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody" tabindex="-1">
      <h2 id="dialogTitle"></h2>
      <div class="dialog-body" id="dialogBody"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </div>
  </div>

  <div class="overlay overlay-sheet" id="settingsPanel" hidden>
    <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="sheet-head">
        <button class="sheet-back" id="settingsBack" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg><span id="settingsBackLabel"></span></button>
        <button class="sheet-done" id="settingsClose" type="button"></button>
      </header>
      <h2 class="sheet-title" id="settingsTitle"></h2>
      <div class="sheet-body" id="settingsBody"></div>
    </aside>
  </div>

  <script defer src="vendor/jszip.min.js?v=213"></script>
  <script defer src="js/config.js?v=213"></script>
  <script defer src="js/copy.js?v=213"></script>
  <script defer src="js/util.js?v=213"></script>
  <script defer src="js/storage.js?v=213"></script>
  <script defer src="js/sentences.js?v=213"></script>
  <script defer src="js/media.js?v=213"></script>
  <script defer src="js/meter.js?v=213"></script>
  <script defer src="js/qc.js?v=213"></script>
  <script defer src="js/input.js?v=213"></script>
  <script defer src="js/ui.js?v=213"></script>
  <script defer src="js/export.js?v=213"></script>
  <script defer src="js/session.js?v=213"></script>
  <script defer src="js/settings.js?v=213"></script>
  <script defer src="js/main.js?v=213"></script>
</body>
</html>
