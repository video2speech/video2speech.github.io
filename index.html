<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#FFFFFF">
<title>Speech Recording · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23D9F0E1'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231E9E52'/%3E%3C/svg%3E">
<script>
  // Same light/dark choice as the recorder (no flash).
  try {
    var savedTheme = localStorage.getItem('v2s_theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (error) { /* storage unavailable */ }
</script>
<link rel="stylesheet" href="css/base.css?v=213">
<style>
  body {
    display: grid;
    place-items: center;
    padding: calc(64px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .corner { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; }
  /* One centred column on a plain page, like the recorder's own screens. */
  .signin {
    width: min(400px, 100%);
    animation: rise .35s var(--ease) both;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: var(--s5); text-align: center; }
  .brand-mark { width: 56px; height: 56px; border-radius: 14px; background: var(--go-tint); display: grid; place-items: center; flex: none; }
  .brand-mark span { width: 20px; height: 20px; border-radius: 50%; background: var(--go-dot); }
  .brand-name { font-size: 15px; font-weight: 600; color: var(--ink-3); }
  .signin h1 { margin-bottom: var(--s2); text-align: center; }
  .signin .lead { margin-bottom: var(--s5); text-align: center; }
  .signin form { display: grid; gap: var(--s4); }
  .signin .check-row { margin-top: 2px; }
  .signin .field-error { min-height: 1.45em; }
  .notes { margin-top: var(--s5); display: grid; gap: var(--s2); text-align: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <button class="icon-btn corner" id="themeButton" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="theme-to-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    <svg class="theme-to-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
  </button>

  <main class="signin">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span></span><span class="brand-name">Speech Recording</span></div>
    <h1>Sign in</h1>
    <p class="lead">Use the username and password you were given.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        <label class="check-row" for="showPassword">
          <input id="showPassword" type="checkbox">
          <span>Show password</span>
        </label>
      </div>
      <p id="error" class="field-error" aria-live="polite"></p>
      <button class="btn btn-go btn-xl btn-block" type="submit">Sign in</button>
    </form>

    <div class="notes">
      <p class="meta">Access is limited to authorized participants.</p>
      <p class="meta">This website is solely for displaying reading materials. All of your recorded data stays on your local device; we do not collect or store it.</p>
    </div>
  </main>

<script>
const APP_VERSION = '213';

let nextAppVersion = null;

async function getLatestAppVersion() {
  try {
    const response = await fetch(`/version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    nextAppVersion = data.nextAppVersion || null;
    return data.appVersion || APP_VERSION;
  } catch (error) {
    console.warn('Failed to check latest app version:', error);
    return APP_VERSION;
  }
}

function addAppVersion(path, appVersion) {
  const url = new URL(path, window.location.origin);
  if (url.pathname === '/app.html' || url.pathname.endsWith('/app.html')) {
    url.searchParams.set('v', appVersion);
  } else if (nextAppVersion && url.pathname.endsWith('/app_next.html')) {
    url.searchParams.set('v', nextAppVersion);
  }
  return url.pathname + url.search + url.hash;
}

function getSafeNext(rawNext, appVersion = APP_VERSION) {
  const fallback = addAppVersion('/app.html', appVersion);
  if (typeof rawNext !== 'string' || rawNext.length === 0) return fallback;
  if (!rawNext.startsWith('/') || rawNext.startsWith('//')) return fallback;
  return addAppVersion(rawNext, appVersion);
}

const params = new URLSearchParams(window.location.search);
let nextPath = getSafeNext(params.get('next'));

getLatestAppVersion().then(appVersion => {
  nextPath = getSafeNext(params.get('next'), appVersion);
  if (sessionStorage.getItem('v2s_auth_ok') === '1') {
    window.location.replace(nextPath);
  }
});

const loginForm = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const showPasswordInput = document.getElementById('showPassword');
const errorEl = document.getElementById('error');
const themeButton = document.getElementById('themeButton');

function labelThemeButton() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
  themeButton.setAttribute('aria-label', label);
  themeButton.title = label;
}

themeButton.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('v2s_theme', next); } catch (error) { /* ignore */ }
  labelThemeButton();
});
labelThemeButton();

usernameInput.addEventListener('input', () => {
  errorEl.textContent = '';
});

passwordInput.addEventListener('input', () => {
  errorEl.textContent = '';
});

showPasswordInput.addEventListener('change', () => {
  passwordInput.type = showPasswordInput.checked ? 'text' : 'password';
});

loginForm.addEventListener('submit', function handleLogin(event) {
  event.preventDefault();

  const username = usernameInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (username === 'nyulangone' && password === 'Flinker2026') {
    sessionStorage.setItem('v2s_auth_ok', '1');
    sessionStorage.setItem('v2s_auth_user', 'NYUlangone');
    window.location.replace(nextPath);
    return;
  }

  errorEl.textContent = 'Invalid username or password.';
  passwordInput.value = '';
  passwordInput.focus();
});
</script>
</body>
</html>
