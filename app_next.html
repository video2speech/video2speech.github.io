<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#F2F1EC">
  <title>Speech Recording</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23D9F0E1'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231E9E52'/%3E%3C/svg%3E">
  <script>
    // Theme first (no flash), then the sign-in and version gate. main.js waits for
    // window.__v2sGate before starting anything.
    (function () {
      try {
        var theme = localStorage.getItem('v2s_theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) { /* storage unavailable */ }

      var APP_VERSION = '205';
      var path = window.location.pathname;
      if (sessionStorage.getItem('v2s_auth_ok') !== '1') {
        window.location.replace('/index.html?next=' + encodeURIComponent(path + window.location.search + window.location.hash));
        window.__v2sGate = new Promise(function () {});
        return;
      }
      // While the new recorder is being tested at app_next.html it follows its own version key.
      var versionKey = /\/app_next\.html$/.test(path) ? 'nextAppVersion' : 'appVersion';
      window.__v2sGate = fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (response) { return response.ok ? response.json() : null; })
        .catch(function () { return null; })
        .then(function (data) {
          var latest = (data && data[versionKey]) || APP_VERSION;
          var url = new URL(window.location.href);
          if (url.searchParams.get('v') !== latest) {
            url.searchParams.set('v', latest);
            window.location.replace(url.pathname + url.search + url.hash);
            return new Promise(function () {});
          }
          return true;
        });
    })();
  </script>
  <link rel="stylesheet" href="css/base.css?v=205">
  <link rel="stylesheet" href="css/app.css?v=205">
</head>
<body data-screen="loading" data-rec="off">
  <div class="app" id="app">
    <!-- Top bar: where you are (recording screen) and the always-available actions -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <div class="where" id="where" hidden>
          <p class="where-text"><span class="where-long" id="whereMain"></span><span class="where-short" id="whereShort"></span><span class="where-sub" id="whereSub"></span></p>
          <div class="bar" aria-hidden="true"><div class="bar-fill" id="whereBar"></div></div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-finish" id="finishButton" type="button" hidden><span class="label-long" id="finishLong"></span><span class="label-short" id="finishShort"></span></button>
        <button class="icon-btn" id="helpButton" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4.2M12 17.6v.2"/></svg>
        </button>
        <button class="icon-btn" id="themeButton" type="button">
          <svg class="theme-to-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <svg class="theme-to-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        </button>
        <button class="icon-btn" id="settingsButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </header>

    <main class="screens">
      <!-- Loading -->
      <section class="screen screen-center" id="screen-loading">
        <div class="spinner" aria-hidden="true"></div>
        <p class="meta" id="loadingText"></p>
      </section>

      <!-- First-time setup: research team or helper, once per device -->
      <section class="screen screen-center" id="screen-setup" hidden>
        <div class="column">
          <p class="eyebrow" id="setupEyebrow"></p>
          <div id="setupStepId">
            <h1 id="setupTitle"></h1>
            <p class="lead" id="setupLead"></p>
            <form id="setupForm" class="form" novalidate autocomplete="off">
              <label class="field-label" for="setupId" id="setupIdLabel"></label>
              <input class="input input-xl" id="setupId" name="participant" type="text" inputmode="text"
                     autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24">
              <p class="field-hint" id="setupHint"></p>
              <p class="field-error" id="setupError" role="alert" hidden></p>
              <button class="btn btn-go btn-xl btn-block" id="setupNext" type="submit"></button>
            </form>
          </div>
          <div id="setupStepConfirm" hidden>
            <h1 id="setupConfirmTitle"></h1>
            <p class="id-display" id="setupConfirmId"></p>
            <div class="options" id="setupLegacy" hidden></div>
            <div class="actions">
              <button class="btn btn-go btn-xl btn-block" id="setupConfirmYes" type="button"></button>
              <button class="btn btn-ghost btn-lg btn-block" id="setupConfirmChange" type="button"></button>
            </div>
          </div>
          <div id="setupStepFolder" hidden>
            <h1 id="setupFolderTitle"></h1>
            <p class="lead" id="setupFolderLead"></p>
            <p class="field-error" id="setupFolderError" role="alert" hidden></p>
            <div class="actions">
              <button class="btn btn-go btn-xl btn-block" id="setupFolderChoose" type="button"></button>
              <button class="btn btn-ghost btn-lg btn-block" id="setupFolderZip" type="button"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Welcome -->
      <section class="screen screen-center" id="screen-welcome" hidden>
        <div class="column column-center">
          <p class="eyebrow" id="welcomeId"></p>
          <h1 id="welcomeTitle"></h1>
          <p class="lead" id="welcomeLead"></p>
          <ol class="stages" id="welcomeStages" hidden>
            <li><span class="num">1</span><span id="welcomeStage1"></span></li>
            <li><span class="num">2</span><span id="welcomeStage2"></span></li>
            <li><span class="num">3</span><span id="welcomeStage3"></span></li>
          </ol>
          <div class="journey" id="welcomeJourney" hidden>
            <div class="journey-row">
              <span class="journey-label" id="welcomePart"></span>
              <span class="journey-count" id="welcomeCount"></span>
            </div>
            <div class="bar bar-strong bar-go" aria-hidden="true"><div class="bar-fill" id="welcomeBar"></div></div>
          </div>
          <div class="notice" id="welcomeNotice" hidden>
            <p id="welcomeNoticeText"></p>
            <button class="btn btn-ghost btn-md" id="welcomeNoticeAction" type="button"></button>
          </div>
          <div class="cta-sticky actions"><button class="btn btn-go btn-xl btn-block" id="welcomeStart" type="button"></button></div>
        </div>
      </section>

      <!-- Folder permission (Chrome/Edge folder mode) -->
      <section class="screen screen-center" id="screen-folder" hidden>
        <div class="column column-center">
          <div class="badge badge-neutral" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2.5h6.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/></svg></div>
          <h1 id="folderTitle"></h1>
          <p class="lead" id="folderLead"></p>
          <p class="field-error" id="folderError" role="alert" hidden></p>
          <div class="actions">
            <button class="btn btn-go btn-xl btn-block" id="folderAllow" type="button"></button>
            <button class="btn btn-ghost btn-lg btn-block" id="folderChoose" type="button"></button>
          </div>
          <button class="btn-text" id="folderZip" type="button"></button>
        </div>
      </section>

      <!-- Camera and microphone check, with a test recording that plays back -->
      <section class="screen" id="screen-check" hidden>
        <div class="check">
          <div class="check-media">
            <div class="preview-frame" id="checkFrame">
              <video id="checkPreview" playsinline muted autoplay></video>
              <video id="checkPlayback" playsinline hidden></video>
              <!-- Only the head is required: an oval (with the rest dimmed) and two faint lines
                   for the neck. No shoulders: fitting them makes people bend their head. -->
              <svg class="face-guide" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <path class="guide-dim" fill-rule="evenodd" d="M -400 -400 H 500 V 500 H -400 Z M 50 9 A 23 30 0 1 0 50.01 9 Z"/>
                <ellipse class="guide-head" cx="50" cy="39" rx="23" ry="30"/>
                <path class="guide-neck" d="M 42 70.5 L 41 92 M 58 70.5 L 59 92"/>
              </svg>
              <p class="preview-badge" id="checkBadge"></p>
            </div>
            <canvas class="wave wave-check" id="checkWave" aria-hidden="true"></canvas>
          </div>
          <div class="check-panel">
            <h1 id="checkTitle"></h1>
            <ol class="check-steps">
              <li>
                <span class="num">1</span>
                <div>
                  <strong id="checkCameraTitle"></strong>
                  <p id="checkCameraText"></p>
                  <p class="device"><span class="device-name" id="cameraName"></span><button class="btn-text" id="changeCamera" type="button"></button></p>
                </div>
              </li>
              <li>
                <span class="num">2</span>
                <div>
                  <strong id="checkMicTitle"></strong>
                  <p id="checkMicText"></p>
                  <p class="device"><span class="device-name" id="micName"></span><button class="btn-text" id="changeMic" type="button"></button></p>
                  <div class="notice notice-stack" id="micWarning" hidden>
                    <p id="micWarningText"></p>
                    <button class="btn btn-ghost btn-md" id="micSwitch" type="button" hidden></button>
                  </div>
                </div>
              </li>
            </ol>
            <div class="test cta-sticky" id="testBox">
              <button class="btn btn-go btn-lg btn-block" id="testRecord" type="button"><span class="btn-icon"><span class="dot-go"></span></span><span id="testRecordLabel"></span></button>
              <div id="testLive" hidden>
                <p class="test-say" id="testSay"></p>
                <div class="bar bar-strong bar-go" aria-hidden="true"><div class="bar-fill" id="testBar"></div></div>
              </div>
              <p class="test-status" id="testStatus" hidden></p>
              <div id="testAsk" hidden>
                <p class="test-question" id="testQuestion"></p>
                <div class="actions">
                  <button class="btn btn-go btn-lg btn-block" id="testYes" type="button"></button>
                  <button class="btn btn-ghost btn-lg btn-block" id="testAgain" type="button"></button>
                </div>
              </div>
              <p class="field-error" id="testError" role="alert" hidden></p>
            </div>
            <button class="btn-text" id="checkHelp" type="button"></button>
          </div>
        </div>
      </section>

      <!-- How to record (first time, and from the ? button) -->
      <section class="screen screen-center" id="screen-howto" hidden>
        <div class="howto">
          <h1 id="howtoTitle"></h1>
          <ol class="howto-steps">
            <li>
              <span class="num">1</span>
              <span class="mock mock-start touch-only" aria-hidden="true"><span class="dot-go"></span><span id="howtoMockStart"></span></span>
              <kbd class="keycap key-only" aria-hidden="true">Space</kbd>
              <p id="howtoStep1"></p>
            </li>
            <li>
              <span class="num">2</span>
              <span class="mock mock-card" aria-hidden="true" id="howtoMockSentence"></span>
              <p id="howtoStep2"></p>
            </li>
            <li>
              <span class="num">3</span>
              <span class="mock mock-stop touch-only" aria-hidden="true"><span class="square"></span><span id="howtoMockStop"></span></span>
              <kbd class="keycap key-only" aria-hidden="true">Space</kbd>
              <p id="howtoStep3"></p>
            </li>
          </ol>
          <div class="howto-redo">
            <span class="mock mock-redo touch-only" aria-hidden="true"><span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span><span id="howtoMockRedo"></span></span>
            <kbd class="keycap key-only" aria-hidden="true">←</kbd>
            <p id="howtoRedo"></p>
          </div>
          <p class="meta howto-keys key-only" id="howtoKeys"></p>
          <div class="cta-sticky howto-cta"><button class="btn btn-go btn-xl btn-block" id="howtoGo" type="button"></button></div>
        </div>
      </section>

      <!-- Recording (practice and real sentences) -->
      <section class="screen screen-record" id="screen-record" hidden data-state="ready">
        <div class="coach" id="coach" hidden aria-live="polite">
          <p class="coach-ack" id="coachAck"><span class="coach-ack-icon" id="coachAckIcon" aria-hidden="true"></span><span id="coachAckText"></span></p>
          <p class="coach-action" id="coachAction"></p>
          <p class="coach-detail" id="coachDetail"></p>
        </div>

        <div class="card" id="card">
          <div class="card-top">
            <p class="status" id="cardStatus" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
              <span id="cardStatusText"></span>
              <span class="status-time" id="cardTimer"></span>
            </p>
            <!-- Camera picture and sound level: grey and still when not recording, live
                 while recording; small, in the corner, never competing with the sentence. -->
            <div class="monitor" aria-hidden="true">
              <canvas class="monitor-wave" id="recordWave"></canvas>
              <div class="cam-thumb" id="recordFrame"><video id="recordPreview" playsinline muted autoplay></video></div>
            </div>
          </div>
          <div class="card-text"><p class="sentence" id="sentenceText"></p></div>
        </div>

        <p class="message is-empty" id="message" aria-live="polite">
          <span class="message-body"><span class="message-icon" id="messageIcon" aria-hidden="true"></span><span id="messageText"></span></span>
        </p>

        <div class="controls">
          <div class="controls-left">
            <button class="btn btn-ghost redo" id="redoButton" type="button">
              <span class="redo-label"><span class="btn-icon" id="redoIcon" aria-hidden="true"></span><span id="redoLabel"></span><kbd class="key-hint" aria-hidden="true">←</kbd></span>
              <span class="redo-caption"><span class="redo-saved" id="redoSaved" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span id="redoSavedText"></span></span><span id="redoCaption"></span></span>
            </button>
          </div>
          <button class="btn btn-go btn-main" id="mainButton" type="button">
            <span class="btn-icon" id="mainIcon" aria-hidden="true"></span>
            <span id="mainLabel"></span>
            <kbd class="key-hint" aria-hidden="true">Space</kbd>
          </button>
        </div>
      </section>

      <!-- Practice done, part breaks, and saving -->
      <section class="screen screen-center" id="screen-break" hidden>
        <div class="column column-center">
          <div class="badge badge-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
          <h1 id="breakTitle"></h1>
          <p class="lead" id="breakLead"></p>
          <div class="save-panel" id="breakSave">
            <p class="save-panel-text" id="breakSaveText"></p>
            <div class="save-progress" id="breakSaveProgress" hidden>
              <div class="bar" aria-hidden="true"><div class="bar-fill" id="breakSaveBar"></div></div>
              <span class="meta" id="breakSaveLabel"></span>
            </div>
          </div>
          <div class="actions cta-sticky">
            <button class="btn btn-go btn-xl btn-block" id="breakPrimary" type="button"></button>
            <button class="btn btn-ghost btn-lg btn-block" id="breakSecondary" type="button"></button>
          </div>
          <button class="btn-text" id="breakTertiary" type="button" hidden></button>
        </div>
      </section>

      <!-- Done -->
      <section class="screen screen-center" id="screen-done" hidden>
        <div class="column column-center">
          <div class="badge badge-neutral" id="doneBadge" aria-hidden="true"></div>
          <h1 id="doneTitle"></h1>
          <p class="lead" id="doneBody"></p>
          <div class="save-panel" id="doneSavePanel" hidden><p class="save-panel-text" id="doneSaveText"></p></div>
          <div class="actions cta-sticky">
            <button class="btn btn-go btn-xl btn-block" id="doneSave" type="button" hidden></button>
            <button class="btn btn-ghost btn-lg btn-block" id="doneAgain" type="button"></button>
          </div>
        </div>
      </section>

      <!-- Problems -->
      <section class="screen screen-center" id="screen-error" hidden>
        <div class="column column-center">
          <div class="badge badge-warn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7.5v6M12 16.8v.2"/><circle cx="12" cy="12" r="9.5"/></svg></div>
          <h1 id="errorTitle"></h1>
          <p class="lead" id="errorBody"></p>
          <p class="help-text" id="errorHelp" hidden></p>
          <div class="actions cta-sticky">
            <button class="btn btn-go btn-xl btn-block" id="errorAction" type="button"></button>
            <button class="btn btn-ghost btn-lg btn-block" id="errorSecondary" type="button" hidden></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- While recording, a green frame runs round the whole screen (a cue that does not depend on reading the card). -->
  <!-- Watches the camera for a frozen picture. Always rendered (2 px, nearly transparent):
       the preview is hidden while recording, and browsers stop updating hidden videos. -->
  <video class="monitor-video" id="monitorVideo" playsinline muted autoplay aria-hidden="true" tabindex="-1"></video>

  <div class="overlay" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody">
      <h2 id="dialogTitle"></h2>
      <div class="dialog-body" id="dialogBody"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </div>
  </div>

  <div class="overlay overlay-sheet" id="settingsPanel" hidden>
    <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="sheet-head">
        <h2 id="settingsTitle"></h2>
        <button class="icon-btn" id="settingsClose" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="settingsBody"></div>
    </aside>
  </div>

  <script defer src="vendor/jszip.min.js?v=205"></script>
  <script defer src="js/config.js?v=205"></script>
  <script defer src="js/copy.js?v=205"></script>
  <script defer src="js/util.js?v=205"></script>
  <script defer src="js/storage.js?v=205"></script>
  <script defer src="js/sentences.js?v=205"></script>
  <script defer src="js/media.js?v=205"></script>
  <script defer src="js/meter.js?v=205"></script>
  <script defer src="js/qc.js?v=205"></script>
  <script defer src="js/input.js?v=205"></script>
  <script defer src="js/ui.js?v=205"></script>
  <script defer src="js/export.js?v=205"></script>
  <script defer src="js/session.js?v=205"></script>
  <script defer src="js/settings.js?v=205"></script>
  <script defer src="js/main.js?v=205"></script>
</body>
</html>
